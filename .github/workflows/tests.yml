name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: ruff check engine tests run.py run_cross_sectional.py run_overfitting_study.py run_offline.py run_experiments.py benchmark.py
      - run: python run_offline.py > /tmp/offline.txt
      - run: diff -u fixtures/synthetic/expected.txt /tmp/offline.txt
      - run: python run_experiments.py --db /tmp/experiments.sqlite demo
      - run: python benchmark.py --symbols 3 --bars 90 --repeats 1
      - run: MPLBACKEND=Agg python run_overfitting_study.py
